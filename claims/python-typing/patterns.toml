# claim: A Protocol with __call__, __name__ and attribute declarations, built by one helper with a single cast, types function objects that carry attributes in all three checkers.
from __future__ import annotations

from collections.abc import Callable
from typing import Protocol, TypeVar, cast

from typing_extensions import ParamSpec, assert_type

P = ParamSpec("P")
R_co = TypeVar("R_co", covariant=True)


class Tagged(Protocol[P, R_co]):
    __name__: str
    key: str

    def __call__(self, *args: P.args, **kwargs: P.kwargs) -> R_co: ...


def tag(fn: Callable[P, R_co], key: str) -> Tagged[P, R_co]:
    tagged = cast("Tagged[P, R_co]", fn)
    tagged.key = key
    return tagged


def is_ready(level: int) -> bool:
    return level > 3


check = tag(is_ready, "ready")
assert_type(check.key, str)
assert_type(check.__name__, str)
assert_type(check(4), bool)
check("high")  # E
check.missing  # E
'''
