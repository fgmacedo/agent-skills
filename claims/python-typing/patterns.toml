# claim: An object that is both a decorator and a callable needs a __call__ overload with a positional-only callable parameter returning it unchanged, plus a call-form overload; decorator methods typed (f: F) -> F keep signatures.
from __future__ import annotations

from collections.abc import Callable
from typing import Any, TypeVar, overload

from typing_extensions import assert_type

F = TypeVar("F", bound=Callable[..., Any])


class Hook:
    def __init__(self) -> None:
        self.handlers: list[Callable[..., Any]] = []

    def before(self, f: F) -> F:
        self.handlers.append(f)
        return f

    @overload
    def __call__(self, f: F, /) -> F: ...
    @overload
    def __call__(self, *args: Any, **kwargs: Any) -> Any: ...
    def __call__(self, *args: Any, **kwargs: Any) -> Any:
        if len(args) == 1 and not kwargs and callable(args[0]):
            self.handlers.append(args[0])
            return args[0]
        return [h(*args, **kwargs) for h in self.handlers]


saved = Hook()


