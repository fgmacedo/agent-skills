from __future__ import annotations

from typing import TYPE_CHECKING, Any, TypeVar, overload

from typing_extensions import assert_type, dataclass_transform

T = TypeVar("T")


class FieldInfo:
    def __init__(self, *, default: Any = None, max_length: int | None = None) -> None:
        self.default, self.max_length = default, max_length


if TYPE_CHECKING:

    @overload
    def Field(*, default: T, max_length: int | None = None) -> T: ...
    @overload
    def Field(*, max_length: int | None = None) -> Any: ...
    def Field(*, default: Any = None, max_length: int | None = None) -> Any: ...

