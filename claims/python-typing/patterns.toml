[probes."patterns/paramspec-dual-decorator"]
"p.py" = '''
# claim: A retry decorator usable as @retry and @retry(times=...) on sync and async functions keeps exact signatures with two overloads, a typed implementation, an async helper over Callable[P, Awaitable[R]] and one cast.
from __future__ import annotations

import functools
import inspect
from collections.abc import Awaitable, Callable, Coroutine
from typing import Any, TypeVar, cast, overload

from typing_extensions import ParamSpec, assert_type

P = ParamSpec("P")
R = TypeVar("R")


@overload
def retry(func: Callable[P, R], /) -> Callable[P, R]: ...
@overload
def retry(*, times: int = 3) -> Callable[[Callable[P, R]], Callable[P, R]]: ...
def retry(
    func: Callable[P, R] | None = None, /, *, times: int = 3
) -> Callable[P, R] | Callable[[Callable[P, R]], Callable[P, R]]:
    def decorate(fn: Callable[P, R]) -> Callable[P, R]:
        if inspect.iscoroutinefunction(fn):
            return cast("Callable[P, R]", _retry_async(fn, times))
        return _retry_sync(fn, times)

    return decorate if func is None else decorate(func)


def _retry_sync(fn: Callable[P, R], times: int) -> Callable[P, R]:
    @functools.wraps(fn)
    def wrapper(*args: P.args, **kwargs: P.kwargs) -> R:
        for _ in range(times - 1):
            try:
                return fn(*args, **kwargs)
            except Exception:
                pass
        return fn(*args, **kwargs)

    return wrapper


def _retry_async(
    fn: Callable[P, Awaitable[R]], times: int
) -> Callable[P, Coroutine[Any, Any, R]]:
    @functools.wraps(fn)
    async def wrapper(*args: P.args, **kwargs: P.kwargs) -> R:
        for _ in range(times - 1):
            try:
                return await fn(*args, **kwargs)
            except Exception:
                pass
        return await fn(*args, **kwargs)

    return wrapper


@retry
def parse(data: bytes, strict: bool = False) -> dict[str, int]:
    return {}


@retry(times=5)
async def fetch(url: str, *, timeout: float = 1.0) -> bytes:
    return b""


assert_type(parse(b"", strict=True), dict[str, int])
parse("text")  # E


async def main() -> None:
    assert_type(await fetch("u", timeout=2.0), bytes)
    await fetch(1)  # E
'''
