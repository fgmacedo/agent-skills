C = TypeVar("C")


class BoundFactory(Generic[C]):
    def __init__(self, owner: type[C], impl: Callable[[type[C], str], C], cache: dict[str, C]) -> None:
        self._owner, self._impl, self._cache = owner, impl, cache

    def __call__(self, key: str) -> C:
        if key not in self._cache:
