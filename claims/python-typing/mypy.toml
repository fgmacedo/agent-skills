expect_exit = 0
expect_output = ['m\.py:9: note: Revealed type is "Any"', 'm\.py:10: note: Revealed type is "Any"']

[[claim]]
id = "mypy-unchecked-body"
ref = "mypy.md"
statement = "bodies of unannotated functions are skipped; assert_type there fails with a note"
probe = "mypy/unchecked-body"
cmd = ["mypy", "--no-incremental", "m.py"]
expect_exit = 1
expect_output = ['"assert_type" expects everything to be "Any" in unchecked functions', "By default the bodies of untyped functions are not checked"]
expect_no_output = ['m\.py:5: error']

[[claim]]
id = "mypy-assert-type-exact"
