[[claim]]
id = "mypy-strict-override-global"
ref = "mypy.md"
statement = "strict = true inside [[tool.mypy.overrides]] applies to every module, silently"
probe = "mypy/strict-override-global"
cmd = ["mypy", "--no-incremental", "pkg"]
expect_exit = 1
expect_output = ['pkg/legacy/m\.py:1: error: Function is missing a type annotation']
expect_no_output = ["unused section", "Per-module sections"]

[[claim]]
id = "mypy-inline-strict-rejected"
ref = "mypy.md"
statement = "inline `# mypy: strict` is an error"
probe = "mypy/inline-strict-rejected"
cmd = ["mypy", "--no-incremental", "m.py"]
expect_exit = 1
expect_output = ['Setting "strict" not supported in inline configuration']

[[claim]]
id = "mypy-global-only-in-override"
ref = "mypy.md"
statement = "a global-only flag in an override is ignored with a warning and exit 0"
probe = "mypy/global-only-in-override"
cmd = ["mypy", "--no-incremental", "pkg"]
expect_exit = 0
expect_output = ['Per-module sections should only specify per-module flags \(warn_redundant_casts\)']

[[claim]]
id = "mypy-per-module-strict-recipe"
ref = "mypy.md"
statement = "listing the per-module strict flags under `module = \"pkg.core.*\"` covers pkg.core itself and leaves other packages lax"
probe = "mypy/per-module-strict-recipe"
cmd = ["mypy", "--no-incremental", "pkg"]
expect_exit = 1
expect_output = ['pkg/core/m\.py:1: error', 'pkg/core/__init__\.py:1: error', 'Found 2 errors']
expect_no_output = ["pkg/legacy", "Per-module sections"]

[[claim]]
id = "mypy-unused-config-section"
ref = "mypy.md"
statement = "warn_unused_configs reports override sections matching no module as a note"
probe = "mypy/unused-config-section"
cmd = ["mypy", "--no-incremental", "m.py"]
expect_exit = 0
expect_output = ["note: unused section\\(s\\): module = \\['nomatch\\.\\*'\\]"]

[[claim]]
id = "mypy-unannotated-return-any"
ref = "mypy.md"
statement = "a function without a return annotation returns Any, even with annotated parameters"
