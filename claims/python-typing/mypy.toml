[probes."mypy/strict-override-global"]
"pkg/__init__.py" = ""
"pkg/core/__init__.py" = ""
"pkg/core/m.py" = '''
def f(x):
    return x
'''
"pkg/legacy/__init__.py" = ""
"pkg/legacy/m.py" = '''
def f(x):
    return x
'''
"pyproject.toml" = '''
[tool.mypy]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "pkg.core.*"
strict = true
'''

[probes."mypy/inline-strict-rejected"]
"m.py" = '''
# mypy: strict

def f(x):
    return x
'''

[probes."mypy/global-only-in-override"]
"pkg/__init__.py" = '''
x = 1
'''
"pyproject.toml" = '''
[tool.mypy]

[[tool.mypy.overrides]]
module = "pkg.*"
warn_redundant_casts = true
'''

[probes."mypy/per-module-strict-recipe"]
"pkg/__init__.py" = ""
"pkg/core/__init__.py" = '''
def g(x):
    return x
'''
"pkg/core/m.py" = '''
def f(x):
    return x
'''
"pkg/legacy/__init__.py" = ""
"pkg/legacy/m.py" = '''
def f(x):
    return x
'''
"pyproject.toml" = '''
[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "pkg.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
'''

[probes."mypy/unused-config-section"]
"m.py" = '''
x = 1
'''
"pyproject.toml" = '''
[tool.mypy]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "nomatch.*"
disallow_untyped_defs = true
'''

[probes."mypy/unannotated-return-any"]
"m.py" = '''
class X: ...

def no_annotations():
    return X()

def params_only(n: int):
    return X()

reveal_type(no_annotations())
reveal_type(params_only(1))
'''

[probes."mypy/unchecked-body"]
"m.py" = '''
from typing import assert_type

def test_untyped():
    assert_type(1, str)
    x: int = "not checked"

def test_typed() -> None:
    assert_type(1, int)
'''

[probes."mypy/assert-type-exact"]
"m.py" = '''
from typing import assert_type


def f(n: int) -> None:
    assert_type(1, int)
    assert_type(n, int)
    assert_type(n, object)
'''

[probes."mypy/ignore-code-mismatch"]
"m.py" = '''
x: int = "a"  # type: ignore[attr-defined]
'''

[probes."mypy/unused-ignore"]
"m.py" = '''
x: int = 1  # type: ignore[assignment]
y: int = "a"  # type: ignore
'''
"pyproject.toml" = '''
[tool.mypy]
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]
'''

[probes."mypy/deprecated-opt-in"]
"m.py" = '''
from typing_extensions import deprecated

@deprecated("use g")
def f() -> None: ...

f()
'''

[probes."mypy/explicit-override-opt-in"]
"m.py" = '''
class A:
    def run(self) -> None: ...

class B(A):
    def run(self) -> None: ...
'''

[probes."mypy/exhaustive-match-opt-in"]
"m.py" = '''
from enum import Enum

class Color(Enum):
    RED = 1
    BLUE = 2

def name(c: Color) -> str:
    match c:
        case Color.RED:
            return "red"
    return "other"
'''

[probes."mypy/strict-no-unreachable"]
"m.py" = '''
def f(x: int) -> int:
    if isinstance(x, int):
        return x
    return "never"
'''

[probes."mypy/output-json"]
"m.py" = '''
x: int = "a"
'''

[probes."mypy/strict-bytes"]
"m.py" = '''
def f(b: bytes) -> None: ...

f(bytearray(b"x"))
f(memoryview(b"x"))
'''

[probes."mypy/allow-redefinition"]
"m.py" = '''
def f() -> None:
    x = 1
    x = "a"
    reveal_type(x)
'''

[probes."mypy/untyped-decorator"]
"m.py" = '''
def deco(fn):
    return fn

@deco
def g(x: int) -> int:
    return x
'''

[probes."mypy/possibly-undefined-opt-in"]
"m.py" = '''
def f(flag: bool) -> int:
    if flag:
        y = 1
    return y
'''
