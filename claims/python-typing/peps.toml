from geo._impl import volume

__all__ = ["volume", "Shape", "inferred", "DEFAULT", "NAMES", "perimeter"]

DEFAULT = 3.0
NAMES = ["a"]


def inferred(x: int):
    return x


class Shape:
    kind = "shape"

