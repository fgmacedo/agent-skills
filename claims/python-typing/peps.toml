# Claims backing references/peps-and-features.md, library-authoring.md and setup.md.

[[claim]]
id = "peps-import-floor-310"
ref = "peps-and-features.md"
statement = "For a 3.10 target, all three checkers reject importing Self, assert_type and reveal_type from typing"
probe = "peps/import-floor"
cmd = ["sh", "-c", "mypy --python-version 3.10 m.py; pyright --pythonversion 3.10 m.py; ty check --python-version 3.10 --output-format concise m.py"]
expect_output = [
  'm\.py:1: error: Module "typing" has no attribute "Self"',
  '"assert_type" is unknown import symbol',
  '"reveal_type" is unknown import symbol',
  "m.py:1:\\d+: error\\[unresolved-import\\] Module `typing` has no member `assert_type`",
]

[[claim]]
id = "peps-import-floor-312"
ref = "peps-and-features.md"
statement = "typing.override is 3.12+; typing.TypeIs, typing.ReadOnly and warnings.deprecated are 3.13+"
probe = "peps/import-floor"
cmd = ["sh", "-c", "pyright --pythonversion 3.12 m.py; ty check --python-version 3.12 --output-format concise m.py; echo ==313; ty check --python-version 3.13 --output-format concise m.py"]
expect_output = [
  '"TypeIs" is unknown import symbol',
  '"ReadOnly" is unknown import symbol',
  '"deprecated" is unknown import symbol',
  "==313\\nAll checks passed!",
]
expect_no_output = ['"override" is unknown import symbol']

