from warnings import deprecated
'''

[probes."peps/forward-ref"]
"m.py" = '''
from typing import ClassVar


class Node:
    registry: ClassVar[dict[str, Node]] = {}

    def clone(self) -> Node:
        return self
'''

[probes."peps/pep696"]
"m.py" = '''
from typing import assert_type


class Box[T = int]:
    def get(self) -> T:
        raise NotImplementedError


def use(plain: Box, explicit: Box[str]) -> None:
    assert_type(plain.get(), int)
    assert_type(explicit.get(), str)
'''

[probes."peps/pep728"]
"m.py" = '''
from typing_extensions import TypedDict


class Closed(TypedDict, closed=True):
    x: int


class Extra(TypedDict, extra_items=str):
    x: int


a: Closed = {"x": 1, "y": 2}  # error in every checker
b: Extra = {"x": 1, "y": "s"}  # valid
c: Extra = {"x": 1, "y": 3}  # error: extra item must be str
'''

[probes."peps/pep747"]
"m.py" = '''
from typing_extensions import TypeForm, assert_type


def trycast[T](form: TypeForm[T], value: object) -> T | None:
    raise NotImplementedError


assert_type(trycast(int | str, 1), int | str | None)
'''

[probes."peps/pep800"]
"m.py" = '''
from typing_extensions import disjoint_base


@disjoint_base
class A: ...


@disjoint_base
class B: ...


class C(A, B): ...
'''

[probes."peps/pep661"]
"builtin.py" = '''
from typing import assert_type

MISSING = sentinel("MISSING")


def f(x: int | MISSING = MISSING) -> int:
    if x is MISSING:
        return 0
    assert_type(x, int)
    return x
'''
"m.py" = '''
from typing_extensions import Sentinel, assert_type

MISSING = Sentinel("MISSING")


def f(x: int | MISSING = MISSING) -> int:
    if x is MISSING:
        return 0
    assert_type(x, int)
    return x
'''

