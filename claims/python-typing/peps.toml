[probes."peps/pep742"]
"m.py" = '''
from typing import TypeGuard, TypeIs, assert_type


def guard(x: object) -> TypeGuard[str]:
    return isinstance(x, str)


def is_str(x: object) -> TypeIs[str]:
    return isinstance(x, str)


def f(x: int | str) -> None:
    if guard(x):
        assert_type(x, str)
    else:
        assert_type(x, int | str)
    if is_str(x):
        assert_type(x, str)
    else:
        assert_type(x, int)
'''

