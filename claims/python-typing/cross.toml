[[claim]]
id = "cross-file-level-mode-comments"
ref = "cross-checker.md"
statement = "`# mypy: ignore-errors` silences the file for mypy only; `# pyright: basic` is a mode, not a suppression, and still reports type errors"
probe = "cross/file-ignore"
cmd = ["sh", "-c", "mypy f2.py; pyright f2.py; ty check --output-format concise f2.py; echo F3; mypy f3.py; pyright f3.py; ty check --output-format concise f3.py"]
expect_output = ['^Success: no issues found', 'f2\.py:2:10 - error', 'f2\.py:2:10: error\[invalid-assignment\]', 'f3\.py:2: error: Incompatible', 'f3\.py:2:10 - error', 'f3\.py:2:10: error\[invalid-assignment\]']


