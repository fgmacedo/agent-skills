# Cross-checker claims for references/cross-checker.md.
# Probe lines in sup-matrix/s.py: 1-7 have an error in every checker, 8-14 have none.
# Comment forms per line: 1/8 bare type: ignore, 2/9 type: ignore[mypy-code],
# 3/10 type: ignore[ty:rule], 4/11 type: ignore[code, ty:rule], 5/12 bare pyright: ignore,
# 6/13 pyright: ignore[rule], 7/14 ty: ignore[rule].

[[claim]]
id = "cross-mypy-only-reads-type-ignore"
ref = "cross-checker.md"
statement = "mypy ignores `# pyright: ignore` and `# ty: ignore` comments entirely"
probe = "cross/sup-matrix"
cmd = ["mypy", "s.py"]
expect_exit = 1
expect_output = ['^s\.py:5: error: Incompatible', '^s\.py:6: error: Incompatible', '^s\.py:7: error: Incompatible']
expect_no_output = ['^s\.py:1[234]:']

[[claim]]
id = "cross-mypy-ty-codes-break-unused-ignore"
ref = "cross-checker.md"
statement = "mypy treats `ty:` codes inside `type: ignore[...]` as its own codes: alone they do not cover the mypy error, combined they are reported unused under warn_unused_ignores"
probe = "cross/sup-matrix"
cmd = ["mypy", "s.py"]
expect_output = [
  '^s\.py:3: note: Error code "assignment" not covered by "type: ignore\[ty:invalid-assignment\]"',
  '^s\.py:4: error: Unused "type: ignore\[ty:invalid-assignment\]" comment',
]

[[claim]]
id = "cross-mypy-unused-ignore-any-code"
ref = "cross-checker.md"
statement = "mypy warn_unused_ignores reports every unneeded `type: ignore`, bare or coded"
probe = "cross/sup-matrix"
cmd = ["mypy", "s.py"]
expect_output = ['^s\.py:8: error: Unused "type: ignore"', '^s\.py:9: error: Unused "type: ignore"', '^s\.py:11: error: Unused']

[[claim]]
id = "cross-pyright-honors-type-ignore-with-any-code"
ref = "cross-checker.md"
statement = "pyright (enableTypeIgnoreComments default true) honors `# type: ignore[...]` whatever the code, plus `# pyright: ignore`, but not `# ty: ignore`"
probe = "cross/sup-matrix"
cmd = ["pyright", "s.py"]
expect_exit = 1
expect_output = ['s\.py:7:11 - error']
expect_no_output = ['s\.py:[1-6]:11 - error']

[[claim]]
id = "cross-pyright-flags-unneeded-type-ignore"
ref = "cross-checker.md"
statement = "pyright reportUnnecessaryTypeIgnoreComment flags every unneeded `type: ignore` (any code) and `pyright: ignore`, and ignores `ty: ignore`"
probe = "cross/sup-matrix"
cmd = ["pyright", "s.py"]
expect_output = [
  's\.py:8:16 - error: Unnecessary "# type: ignore" comment',
  's\.py:9:16 - error: Unnecessary "# type: ignore" comment',
  's\.py:11:16 - error: Unnecessary "# type: ignore" comment',
  's\.py:12:16 - error: Unnecessary',
  's\.py:13:32 - error: Unnecessary "# pyright: ignore" rule: "reportAssignmentType"',
]
expect_no_output = ['s\.py:14:']

[[claim]]
id = "cross-pyright-etic-false"
ref = "cross-checker.md"
statement = "With enableTypeIgnoreComments = false pyright neither honors nor reports `type: ignore`; only `pyright: ignore` counts"
probe = "cross/sup-etic-false"
cmd = ["pyright", "s.py"]
expect_output = ['s\.py:1:11 - error', 's\.py:4:11 - error', 's\.py:12:16 - error: Unnecessary', 's\.py:13:32 - error: Unnecessary']
expect_no_output = ['s\.py:[56]:11 - error', 's\.py:(8|9|10|11):16']

[[claim]]
id = "cross-basedpyright-default-ignores-type-ignore"
ref = "cross-checker.md"
statement = "basedpyright defaults to enableTypeIgnoreComments = false and warns on `# pyright: ignore` without a rule (reportIgnoreCommentWithoutRule)"
probe = "cross/sup-matrix"
cmd = ["basedpyright", "s.py"]
expect_output = ['s\.py:1:11 - error', 's\.py:4:11 - error', 's\.py:5:18 - warning: `pyright: ignore` comment must specify a rule']
expect_no_output = ['s\.py:6:11 - error', 's\.py:(8|9|10|11):16']

[[claim]]
id = "cross-ty-type-ignore-codes"
ref = "cross-checker.md"
statement = "ty honors bare `# type: ignore` and `type: ignore[ty:rule]` (also inside a combined list) but not `type: ignore[mypy-code]`, nor `# pyright: ignore`"
probe = "cross/sup-matrix"
cmd = ["ty", "check", "--output-format", "concise", "s.py"]
expect_output = ['^s\.py:2:11: error\[invalid-assignment\]', '^s\.py:5:11: error\[invalid-assignment\]', '^s\.py:6:11: error\[invalid-assignment\]']
expect_no_output = ['^s\.py:[1347]:11:']

[[claim]]
id = "cross-ty-unused-type-ignore"
ref = "cross-checker.md"
statement = "ty reports unneeded bare and `ty:`-coded `type: ignore` (unused-type-ignore-comment) and `ty: ignore` (unused-ignore-comment), but never a `type: ignore` carrying only mypy codes"
probe = "cross/sup-matrix"
cmd = ["ty", "check", "--output-format", "concise", "s.py"]
expect_output = [
  '^s\.py:8:14: error\[unused-type-ignore-comment\] Unused blanket',
  '^s\.py:10:14: error\[unused-type-ignore-comment\]',
  '^s\.py:11:41: error\[unused-type-ignore-comment\]',
  '^s\.py:14:14: error\[unused-ignore-comment\]',
]
expect_no_output = ['^s\.py:(9|12|13):']

[[claim]]
id = "cross-ty-unused-default-warn-exit-1"
ref = "cross-checker.md"
statement = "ty's unused-ignore rules default to warn, and a warning alone makes `ty check` exit 1"
probe = "cross/sup-ty-warn"
cmd = ["ty", "check", "--output-format", "concise", "w.py"]
expect_exit = 1
expect_output = ['warning\[unused-type-ignore-comment\]']

[[claim]]
id = "cross-ty-respect-type-ignore-false"
ref = "cross-checker.md"
statement = "ty `respect-type-ignore-comments = false` makes ty ignore every `type: ignore`"
probe = "cross/ty-respect-false"
cmd = ["ty", "check", "--output-format", "concise", "n.py"]
expect_output = ['^n\.py:1:10: error\[invalid-assignment\]']

[[claim]]
id = "cross-file-level-type-ignore"
ref = "cross-checker.md"
statement = "A `# type: ignore` line before any code silences the whole file in mypy, pyright and ty; after a docstring it is just an unused ignore"
probe = "cross/file-ignore"
cmd = ["sh", "-c", "mypy f1.py; pyright f1.py; ty check --output-format concise f1.py; echo F4; mypy f4.py; pyright f4.py; ty check --output-format concise f4.py"]
expect_output = ['(?s)Success: no issues found.*0 errors.*All checks passed!.*F4', 'f4\.py:2: error: Unused "type: ignore"', 'f4\.py:3:10 - error', 'f4\.py:2:1: error\[unused-type-ignore-comment\]']
expect_no_output = ['f1\.py:\d']

[[claim]]
id = "cross-mypy-type-ignore-must-come-first"
ref = "cross-checker.md"
statement = "mypy only sees `# type: ignore` when it is the first comment on the line; pyright and ty find their comments anywhere"
probe = "cross/sup-order"
cmd = ["sh", "-c", "mypy c.py; echo TY; ty check --output-format concise c.py"]
expect_output = ['^c\.py:3: error: Incompatible', '^c\.py:4: error: Incompatible', '^c\.py:5: error: Incompatible', 'TY\nAll checks passed!']
expect_no_output = ['^c\.py:[12]: error']

[[claim]]
id = "cross-pyright-redundant-next-to-type-ignore"
ref = "cross-checker.md"
statement = "With default pyright settings a `# pyright: ignore[rule]` next to a `# type: ignore[code]` that already covers the line is reported unnecessary"
probe = "cross/sup-order"
cmd = ["pyright", "c.py"]
expect_output = ['c\.py:1:62 - error: Unnecessary "# pyright: ignore" rule', 'c\.py:3:34 - error: Unnecessary "# pyright: ignore" rule']
expect_no_output = ['c\.py:2:\d+ - error']

[[claim]]
id = "cross-mypy-only-error-conflicts-with-pyright"
ref = "cross-checker.md"
statement = "A `# type: ignore[code]` for a mypy-only error is reported unnecessary by pyright unless enableTypeIgnoreComments = false; a bare `# ty: ignore` suppresses every ty diagnostic on the line"
probe = "cross/mypy-only-ignore"
cmd = ["sh", "-c", "mypy m.py; pyright m.py; ty check --output-format concise m.py; echo ETIC; cp pyproject-etic-false.toml pyproject.toml; pyright m.py"]
expect_output = ['m\.py:10:12 - error: Unnecessary "# type: ignore" comment', 'All checks passed!', '(?s)ETIC(?!.*m\.py:10:12).*m\.py:11:10 - error']
expect_no_output = ['^m\.py:10: error']

[[claim]]
id = "cross-return-inference"
ref = "cross-checker.md"
statement = "The result of a call to a function without a return annotation is Any in mypy, Unknown in ty; only pyright infers it"
probe = "cross/divergences"
cmd = ["sh", "-c", "mypy d1.py; pyright d1.py; ty check --output-format concise d1.py"]
expect_output = ['d1\.py:17: note: Revealed type is "Any"', 'd1\.py:17:13 - information: Type of "ret\(\)" is "C"', 'd1\.py:17:13: info\[revealed-type\] Revealed type: `Unknown`']

[[claim]]
id = "cross-untyped-body"
ref = "cross-checker.md"
statement = "mypy skips bodies of unannotated functions by default (annotation-unchecked note); pyright and ty check them"
probe = "cross/divergences"
cmd = ["sh", "-c", "mypy d1.py; pyright d1.py; ty check --output-format concise d1.py"]
expect_output = ['d1\.py:20: note: By default the bodies of untyped functions are not checked', 'd1\.py:20:14 - error', 'd1\.py:20:14: error\[invalid-assignment\]']

[[claim]]
id = "cross-method-assign"
ref = "cross-checker.md"
statement = "Assigning to a method: on the class only mypy errors (method-assign); on an instance mypy (method-assign) and ty (invalid-assignment) error; pyright is silent"
probe = "cross/divergences"
cmd = ["sh", "-c", "mypy d1.py; pyright d1.py; ty check --output-format concise d1.py"]
expect_output = ['d1\.py:10: error: Cannot assign to a method  \[method-assign\]', 'd1\.py:12: error: Cannot assign to a method', 'd1\.py:12:1: error\[invalid-assignment\]']
expect_no_output = ['d1\.py:1[02]:\d+ - error', 'd1\.py:10:\d+: error']

[[claim]]
id = "cross-possibly-unbound-loop"
ref = "cross-checker.md"
statement = "A variable bound only inside a `for` loop and used after it is reported possibly unbound by pyright only"
probe = "cross/divergences"
