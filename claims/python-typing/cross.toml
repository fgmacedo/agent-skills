[probes."cross/divergences"]
"d1.py" = '''
from typing import reveal_type

class C:
    def m(self) -> int:
        return 1

def f(self: C) -> int:
    return 2

C.m = f
c = C()
c.m = lambda: 3

def ret():
    return C()

reveal_type(ret())

def body(x):
