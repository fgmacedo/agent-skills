expect_output = ['d1\.py:25:7 - error: "last" is possibly unbound \(reportPossiblyUnboundVariable\)']
expect_no_output = ['d1\.py:25: error', 'd1\.py:25:\d+: (error|warning)']

[[claim]]
id = "cross-hasattr-narrowing"
