[[claim]]
id = "cross-joins-vs-unions"
ref = "cross-checker.md"
statement = "Mixed literals: mypy joins list/dict items to object; ty keeps the union; pyright reports Unknown item types; ternaries are int | str in mypy and Literal unions elsewhere"
probe = "cross/joins"
cmd = ["sh", "-c", "mypy j.py; pyright j.py; ty check --output-format concise j.py"]
expect_output = [
  'j\.py:5: note: Revealed type is "int \| str"', 'j\.py:6: note: Revealed type is "list\[object\]"',
  'j\.py:6:17 - information: Type of "\[1, "a"\]" is "list\[Unknown\]"', "j\\.py:5:17 - information: Type of \"x\" is \"Literal\\[1, 's'\\]\"",
  'j\.py:6:17: info\[revealed-type\] Revealed type: `list\[int \| str\]`',
]

[[claim]]
id = "cross-version-source"
ref = "cross-checker.md"
statement = "ty takes the target version from requires-python; mypy and pyright use the running interpreter unless python_version / pythonVersion is set"
probe = "cross/version-source"
cmd = ["sh", "-c", "mypy p.py; pyright p.py; ty check --output-format concise p.py; echo PINNED; cp pyproject-pinned.toml pyproject.toml; mypy p.py; pyright p.py"]
expect_output = ['(?s)Success: no issues found.*0 errors.*p\.py:1:20: error\[unresolved-import\] Module `typing` has no member `assert_type`.*PINNED', 'PINNED\np\.py:1: error: Module "typing" has no attribute "assert_type"', '"assert_type" is unknown import symbol']

[[claim]]
id = "cross-ty-project-root"
ref = "cross-checker.md"
statement = "ty resolves first-party imports from the project root discovered from the working directory; run outside it, the probe gets unresolved-import and Unknown"
probe = "cross/probe-root"
cmd = ["sh", "-c", "cd proj && ty check --output-format concise probe.py; cd ../outside && ty check --output-format concise probe.py"]
expect_output = ['All checks passed!', 'probe\.py:2:6: error\[unresolved-import\] Cannot resolve imported module `pkg`', 'Type `Unknown` does not match asserted type `int`']

[[claim]]
id = "cross-mypy-assert-type-unchecked"
ref = "cross-checker.md"
statement = "assert_type inside an unannotated function fails in mypy because the body is unchecked; annotate `-> None`"
