expect_output = ['d1\.py:35: note: Revealed type is "Any"', 'd1\.py:35:23 - error: Cannot access attribute "name" for class "object"', 'd1\.py:35:21: info\[revealed-type\] Revealed type: `object`']

[[claim]]
id = "cross-metaclass-call"
ref = "cross-checker.md"
statement = "mypy ignores a metaclass `__call__` return type when evaluating a constructor call; pyright and ty honor it"
