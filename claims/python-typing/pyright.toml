[probes."pyright/standard-vs-basic"]
"basic.json" = '''
{"typeCheckingMode": "basic"}
'''
"m.py" = '''
from typing import overload


class A:
    x: int = 0

    def f(self, x: int) -> int:
        return x


class B(A):
    x: str = ""  # incompatible variable override

    def f(self, x: str) -> int:  # incompatible method override
        return 0


def g() -> None: ...


print(g.missing)  # function member access


@overload
def h(x: int) -> int: ...
@overload
def h(x: int) -> str: ...
def h(x: int) -> int | str:
    return x


def k(flag: bool) -> int:
    if flag:
        y = 1
    return y
'''
"pyrightconfig.json" = '''
{}
'''

[probes."pyright/strict-only"]
