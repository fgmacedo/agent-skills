# pyright: strict
import os
from typing import Any
from warnings import deprecated


def untyped(x, y=1):
    return x


def raw(items: list) -> dict:
    return {}


class C:
    _secret = 1


print(C._secret)


def check(x: int) -> None:
    if isinstance(x, int):
        pass


def explicit(x: Any) -> Any:
    return x.anything


@deprecated("use new")
def old() -> None: ...


old()


def deco(f):
    return f


@deco
def decorated() -> None: ...


def matcher(x: int | str) -> None:
    match x:
        case int():
            pass


def caster(x: int) -> int:
    from typing import cast

    return cast(int, x)
'''
