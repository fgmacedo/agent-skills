[[claim]]
id = "pyright-default-mode-is-standard"
ref = "pyright.md"
statement = "With no typeCheckingMode, pyright runs standard: it reports the five rules standard adds over basic"
probe = "pyright/standard-vs-basic"
cmd = ["pyright", "m.py"]
expect_exit = 1
expect_output = [
  "reportIncompatibleVariableOverride",
  "reportIncompatibleMethodOverride",
  "reportFunctionMemberAccess",
  "reportOverlappingOverload",
  "reportPossiblyUnbound",
]

